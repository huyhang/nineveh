[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nineveh"
version = "0.1.0"
description = "A self-hosted OPDS 2.0 server for CBZ comic and manga libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pillow>=11,<13",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  # Runs the shipped JavaScript under an embedded engine, so the reader and the
  # catalog scripts are covered by `pytest` without adding Node to CI. 0.6 is
  # the QuickJS release: the controller tests need classes and async functions.
  "dukpy>=0.6,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
nineveh = "nineveh.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nineveh"]

[tool.pytest.ini_options]
addopts = "-q --cov=nineveh --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["nineveh"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

