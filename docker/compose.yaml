# Without this, Compose names the project after the directory holding this file
# -- "docker" -- which is what Docker Desktop and `docker compose ls` display,
# and which would collide with any other project laid out the same way. Compose
# lowercases project names, so this is `nineveh`, not `Nineveh`.
name: nineveh

services:
  nineveh:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nineveh:local
    container_name: nineveh
    restart: unless-stopped
    init: true
    user: "${NINEVEH_PUID:-10001}:${NINEVEH_PGID:-10001}"
    ports:
      - "${NINEVEH_PORT:-8080}:8080"
    environment:
      NINEVEH_DATA_DIR: /data
      NINEVEH_STATE_DIR: /state
      NINEVEH_PUBLIC_BASE_URL: "${NINEVEH_PUBLIC_BASE_URL:-}"
      NINEVEH_ADMIN_USERNAME: "${NINEVEH_ADMIN_USERNAME:-admin}"
      NINEVEH_ADMIN_PASSWORD: "${NINEVEH_ADMIN_PASSWORD:-}"
      NINEVEH_ADMIN_PASSWORD_FILE: "${NINEVEH_ADMIN_PASSWORD_FILE:-/run/secrets/admin_password.txt}"
      NINEVEH_SECURE_COOKIES: "${NINEVEH_SECURE_COOKIES:-true}"
      NINEVEH_MEMORY_LIMIT: "${NINEVEH_MEMORY_LIMIT:-1g}"
      NINEVEH_RESTART_ENABLED: "${NINEVEH_RESTART_ENABLED:-true}"
      NINEVEH_FORWARDED_ALLOW_IPS: "${NINEVEH_FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - "${NINEVEH_DATA_PATH:?Set NINEVEH_DATA_PATH in .env}:/data:ro"
      - "${NINEVEH_STATE_PATH:?Set NINEVEH_STATE_PATH in .env}:/state"
      - "${NINEVEH_SECRETS_PATH:-./secrets}:/run/secrets:ro"
    # A ceiling, not a target: Nineveh idles around 80-120 MB. The limit exists so
    # a runaway image decode fails inside the container instead of pressuring DSM.
    mem_limit: "${NINEVEH_MEMORY_LIMIT:-1g}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
